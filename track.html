<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("rio-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order — RIO Furnitures</title>
  <meta name="description" content="Track your RIO Furnitures order, from quote to delivery.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23ff5a1f%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial Narrow,Arial,sans-serif%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%231b1a18%27%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin-500-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/barlow-condensed-latin-600-normal.woff2" crossorigin>
  <link rel="stylesheet" href="css/rio.css?v=5">
</head>
<body data-page="track">
<header id="site-header"></header>

<main id="main">
  <section class="intro">
    <div class="wrap narrow">
      <h1 class="h-xl">Track your order</h1>
      <p class="lead">Enter your order code, or the reference you got when you sent your request.</p>
      <form class="track-form mt-m" id="track-form" autocomplete="off">
        <label class="sr" for="track-code">Order code</label>
        <input class="input track-input" id="track-code" placeholder="RIO-7K3Q or Q-7K3QD" spellcheck="false">
        <button class="btn" type="submit">Track</button>
      </form>
      <p class="track-msg" id="track-msg" role="status"></p>
    </div>
  </section>
  <div class="wrap narrow" id="track-result"></div>
</main>

<footer id="site-footer"></footer>
<script src="js/data.js?v=14"></script>
<script src="js/store.js?v=14"></script>
<script src="js/main.js?v=14"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=14"></script>
<script src="js/backend.js?v=14"></script>
<script src="js/orders.js?v=14"></script>
<script src="js/track.js?v=14"></script>
</body>
</html>
