<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("rio-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order — RIO Furnitures</title>
  <meta name="description" content="Track your RIO Furnitures order — from quote to delivery.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23151412%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23cf8646%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter+Tight:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/pages.css?v=6">
  <link rel="stylesheet" href="css/theme.css?v=20">
</head>
<body data-page="track">
<header id="site-header"></header>

<main>
  <section class="intro">
    <div class="wrap narrow">
      <p class="mono muted">Track your order</p>
      <h1 class="serif s-xl reveal">Where's my<br><em>furniture?</em></h1>
      <p class="lead reveal" data-d="1">Enter your order code, or the reference you got when you sent your request.</p>
      <form class="track-form mt-m" id="track-form" autocomplete="off">
        <label class="sr" for="track-code">Order code</label>
        <input class="input track-input" id="track-code" placeholder="RIO-7K3Q or Q-7K3QD" spellcheck="false">
        <button class="btn btn-o" type="submit">Track <span class="arr">→</span></button>
      </form>
      <p class="track-msg" id="track-msg" role="status"></p>
    </div>
  </section>
  <div class="wrap narrow" id="track-result"></div>
</main>

<footer id="site-footer"></footer>
<script src="js/data.js?v=8"></script>
<script src="js/store.js?v=6"></script>
<script src="js/main.js?v=8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=6"></script>
<script src="js/backend.js?v=6"></script>
<script src="js/orders.js?v=6"></script>
<script src="js/track.js?v=6"></script>
</body>
</html>
