<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("rio-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start a Project — RIO Furnitures</title>
  <meta name="description" content="Tell RIO about your space, what you need and how many. Upload drawings and send your project.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23ff5a1f%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial Narrow,Arial,sans-serif%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%231b1a18%27%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin-500-normal.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/barlow-condensed-latin-600-normal.woff2" crossorigin>
  <link rel="stylesheet" href="css/rio.css?v=8">
</head>
<body data-page="start">
<header id="site-header"></header>

<main id="main">
  <section class="intro" style="padding-bottom:32px">
    <div class="wrap">
      <span class="eyebrow" id="s-kicker">Start a project</span>
      <h1 class="h-xl" id="s-title">Tell us about your space.</h1>
    </div>
  </section>
  <div class="wrap flow">
    <aside class="flow-aside">
      <p class="meta" id="s-count">Step 1 of 4</p>
      <div class="progress"><span id="s-prog"></span></div>
      <ol class="flow-steps" id="s-steps"></ol>
    </aside>
    <form id="s-form" novalidate onsubmit="return false">
      <div id="s-body"></div>
      <div class="f-foot">
        <button type="button" class="link" id="s-back">Back</button>
        <span class="msg" id="s-msg" role="alert"></span>
        <button type="button" class="btn" id="s-next">Continue</button>
      </div>
    </form>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="js/data.js?v=18"></script>
<script src="js/store.js?v=18"></script>
<script src="js/supabase-config.js?v=18"></script>
<script src="js/main.js?v=18"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/backend.js?v=18"></script>
<script src="js/start.js?v=18"></script>
</body>
</html>
