<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start a Project — RIO Furnitures</title>
  <meta name="description" content="Tell RIO what you are building, what you need and how much. Upload drawings and send your project.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23151412%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23ff5a1f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/pages.css?v=2">
</head>
<body data-page="start">
<header id="site-header"></header>

<main>
  <section class="intro" style="padding-bottom:24px">
    <div class="wrap">
      <p class="mono muted" id="s-kicker">Start a project</p>
      <h1 class="serif s-xl" id="s-title">Tell us about<br><em>the space.</em></h1>
    </div>
  </section>
  <div class="wrap flow">
    <aside class="flow-aside">
      <p class="mono muted" id="s-count">Step 01 / 05</p>
      <div class="progress"><span id="s-prog"></span></div>
      <ol class="flow-steps" id="s-steps"></ol>
    </aside>
    <form id="s-form" novalidate onsubmit="return false">
      <div id="s-body"></div>
      <div class="f-foot">
        <button type="button" class="link" id="s-back">← Back</button>
        <span class="msg" id="s-msg" role="alert"></span>
        <button type="button" class="btn" id="s-next">Continue <span class="arr">→</span></button>
      </div>
    </form>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="js/data.js?v=2"></script>
<script src="js/store.js?v=2"></script>
<script src="js/main.js?v=2"></script>
<script src="js/scenes.js?v=2"></script>
<script src="js/start.js?v=2"></script>
</body>
</html>
